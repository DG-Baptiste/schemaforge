repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        pass_filenames: false
        args: [src]
        additional_dependencies:
          - httpx>=0.27
          - jsonschema>=4.23
          - pydantic>=2.10
          - structlog>=24.4
          - typer>=0.15
          - types-jsonschema>=4.23

